<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b10">
  <meta name="description" content="Shadowrocket network status and configuration">

  <title>t0u9h@shw-node:~</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #080b10;
      --panel: #0e131b;
      --border: #202b38;
      --text: #d6e2f0;
      --muted: #8291a5;
      --green: #64f5a2;
      --cyan: #65d9ff;
      --red: #ff7777;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
        Consolas, "Liberation Mono", monospace;
      font-size: 13px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .header {
      margin-bottom: 22px;
      color: var(--green);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .panel {
      margin-bottom: 16px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }

    .panel-title {
      margin: 0 0 14px;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .ip-row {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }

    .ip-row:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .ip-label {
      color: var(--muted);
    }

    .ip-value {
      min-width: 0;
      max-width: 100%;
      color: var(--green);
      text-align: right;
      line-height: 1.6;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .ip-value.loading {
      color: var(--muted);
    }

    .ip-value.error {
      color: var(--red);
    }

    .links {
      display: grid;
      gap: 10px;
    }

    .link {
      display: block;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--cyan);
      background: var(--panel);
      text-decoration: none;
      overflow-wrap: anywhere;
      transition: border-color 0.2s, background 0.2s;
    }

    .link:hover,
    .link:focus-visible {
      border-color: var(--cyan);
      background: #121c27;
    }

    .footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 360px) {
      body {
        padding: 18px 10px;
      }

      .panel {
        padding: 12px;
      }

      .ip-row {
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 6px;
      }

      .ip-value {
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="header">
      t0u9h@shw-node:~
    </header>

    <section class="panel" aria-labelledby="network-title">
      <h2 class="panel-title" id="network-title">Network status</h2>

      <div class="ip-row">
        <span class="ip-label">Global IP:</span>
        <span
          class="ip-value loading"
          id="global-ip"
          role="status"
          aria-live="polite"
        >Загрузка...</span>
      </div>

      <div class="ip-row">
        <span class="ip-label">Direct IP:</span>
        <span
          class="ip-value loading"
          id="direct-ip"
          role="status"
          aria-live="polite"
        >Загрузка...</span>
      </div>
    </section>

    <nav class="links" aria-label="Ссылки">
      <a
        class="link"
        href="https://apps.apple.com/ru/app/shadowrocket/id932747118"
        target="_blank"
        rel="noopener noreferrer"
      >[ Download Shadowrocket ]</a>

      <a href="sub://https://t0u9h.github.io/config1.2.conf" class="link">
        [ Add subscription ]
      </a>
    </nav>

    <footer class="footer">
      © by t0u9h
    </footer>
  </main>

  <script>
    "use strict";

    const REQUEST_TIMEOUT = 7000;

    const IP_SERVICES = {
      global: {
        url: "https://ipwho.is/",
        elementId: "global-ip",
        parse(data) {
          if (data.success === false || !isValidIP(data.ip)) {
            throw new Error("Некорректный ответ сервиса");
          }

          return formatResult(data.ip, data.country || data.country_code);
        }
      },

      direct: {
        url: "https://api.ipgeo.ru/",
        elementId: "direct-ip",
        parse(data) {
          if (data.ok !== true || !isValidIP(data.ip)) {
            throw new Error("Некорректный ответ сервиса");
          }

          return formatResult(data.ip, data.country);
        }
      }
    };

    function isValidIP(value) {
      if (typeof value !== "string") {
        return false;
      }

      // Проверяем формат IPv4.
      const ipv4 =
        /^(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)$/;

      if (ipv4.test(value)) {
        return true;
      }

      // Базовая проверка IPv6.
      // Дополнительно допускаем сокращённую запись ::.
      if (!value.includes(":") || !/^[0-9a-f:.]+$/i.test(value)) {
        return false;
      }

      try {
        return new URL(`http://[${value}]/`).hostname.length > 0;
      } catch {
        return false;
      }
    }

    function formatResult(ip, country) {
      const location =
        typeof country === "string" && country.trim()
          ? country.trim()
          : "страна не определена";

      return `${ip} (${location})`;
    }

    async function fetchIP(service) {
      const element = document.getElementById(service.elementId);
      const controller = new AbortController();
      const timeout = setTimeout(
        () => controller.abort(),
        REQUEST_TIMEOUT
      );

      element.classList.remove("error");
      element.classList.add("loading");
      element.textContent = "Загрузка...";

      try {
        const response = await fetch(service.url, {
          method: "GET",
          cache: "no-store",
          signal: controller.signal,
          headers: {
            Accept: "application/json"
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        element.textContent = service.parse(data);
      } catch (error) {
        element.textContent =
          error.name === "AbortError"
            ? "Время ожидания истекло"
            : "Недоступно";

        element.classList.add("error");
      } finally {
        clearTimeout(timeout);
        element.classList.remove("loading");
      }
    }

    function refreshIPs() {
      fetchIP(IP_SERVICES.global);
      fetchIP(IP_SERVICES.direct);
    }

    refreshIPs();
  </script>
</body>
</html>
