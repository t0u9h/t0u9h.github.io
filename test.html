<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self';
      connect-src 'self' https://ipwho.is https://api.ipify.org https://suggestions.dadata.ru;
      object-src 'none';
      base-uri 'self';
      frame-ancestors 'none';
    ">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>shadowrocket // t0u9h</title>
    <style>
        @font-face {
            font-family: 'JetBrains Mono';
            font-style: normal;
            font-weight: 400;
            src: local('JetBrains Mono'), local('JetBrainsMono-Regular');
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'JetBrains Mono', monospace, sans-serif; 
            -webkit-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            overscroll-behavior: none;
        }

        body { 
            background: #0b0f19; 
            color: #f8fafc; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 16px; 
            touch-action: none; 
        }
        
        .terminal-window { 
            width: 100%; 
            max-width: 440px; 
            background: #0f172a; 
            border: 1px solid #334155; 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); 
        }
        
        .titlebar { 
            background: #1e293b; 
            padding: 12px 16px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 1px solid #334155; 
        }

        .dots { display: flex; gap: 8px; }
        .dot { width: 11px; height: 11px; border-radius: 50%; }
        .dot-red { background: #ef4444; }
        .dot-yellow { background: #f59e0b; }
        .dot-green { background: #10b981; }
        .window-title { font-size: 11px; color: #94a3b8; font-weight: 600; }
        
        .body { padding: 18px 16px; }
        
        .cmd-line { 
            margin-bottom: 12px; 
            font-size: 12px; 
            font-weight: 500; 
            word-break: break-word;
        }
        .user { color: #10b981; }
        .host { color: #38bdf8; }
        
        .ip-panel {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 14px;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .ip-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ip-label {
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ip-value {
            color: #38bdf8;
            font-weight: 600;
        }

        .file-list { display: flex; flex-direction: column; gap: 10px; }
        
        .file-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            background: #1e293b; 
            border: 1px solid #334155; 
            padding: 10px 12px; 
            border-radius: 10px; 
            gap: 10px;
            height: 52px;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .file-name { 
            color: #f8fafc; 
            font-weight: 600; 
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sr-logo {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .sr-logo svg {
            width: 24px;
            height: 24px;
        }

        .btn-common {
            width: 100px;
            height: 34px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
            transition: opacity 0.2s, background 0.2s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-action { 
            background: #0284c7; 
            color: #fff; 
            border: none;
        }

        .btn-action:hover { background: #0369a1; }

        .btn-appstore {
            background: #f8fafc;
            color: #0f172a;
        }

        .btn-appstore:hover { opacity: 0.9; }

        footer { 
            margin-top: 16px; 
            text-align: center; 
            font-size: 11px; 
            color: #475569; 
        }

        @media (max-width: 360px) {
            .body { padding: 12px 10px; }
            .file-row { padding: 8px; }
            .file-name { font-size: 11px; }
            .btn-common { width: 88px; height: 30px; font-size: 10px; }
            .sr-logo { width: 24px; height: 24px; }
            .sr-logo svg { width: 20px; height: 20px; }
            .ip-panel { font-size: 10px; }
        }
    </style>
</head>
<body>

        <stop offset="0%" stop-color="#38bdf8" />

    <div class="terminal-window">

        <div class="body">

                <span class="user">t0u9h</span>@<span class="host">shw-node</span>:~$ ./network_status.sh
            </div>

            <div class="ip-panel">
                <div class="ip-row">
                    <span class="ip-label"><svg style="width:12px;height:12px;fill:currentColor;" viewBox="0 0 512 512"><path d="M352 256c0 22.2-1.2 43.6-3.5 64H163.5c-2.2-20.4-3.5-41.8-3.5-64s1.2-43.6 3.5-64H348.5c2.2 20.4 3.5 41.8 3.5 64zm28.8 64H492.4c16.2-38.3 25.6-80.1 25.6-128s-9.4-89.7-25.6-128H380.8c5.4 39.4 8.2 81 8.2 128s-2.8 88.6-8.2 128zm-305.6 0H19.6C9.4 290.3 0 248.5 0 200s9.4-89.7 25.6-128H131.2C125.8 111.4 123 153 123 200s2.8 88.6 8.2 128z"/></svg> Global IP:</span>

                </div>
                <div class="ip-row">

                        <span class="file-name" style="color: #38bdf8;">App Store</span>

                <!-- Config 1.2 -->

                    <div class="file-info">

                    </div>
                    <a href="sub://https://t0u9h.github.io/config1.2.conf" class="btn-common btn-action">
                        sub://

                </div>
            </div>

            <footer>© by t0u9h</footer>
        </div>
    </div>

    <script>
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        // 1. Global IP via ipwho.is (PROXY)
        async function fetchGlobalIP() {
            try {
                const res = await fetch('https://ipwho.is/');
                const resData = await res.json();
                if (resData.success) {
                    document.getElementById('global-ip').textContent = `${resData.ip} (${resData.country_code || ''})`;
                } else {
                    document.getElementById('global-ip').textContent = 'failed';
                }
            } catch (e) {
                document.getElementById('global-ip').textContent = 'offline';
            }
        }

        // 2. RU IP via DaData iplocate (DIRECT)
        async function fetchRuIP() {
            const el = document.getElementById('ru-ip');
            const token = "754315cb97624ed87545c3721a1d3b0d376b4431";

            try {
                // Сначала узнаем текущий прямой IP клиента через ipify
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                const clientIp = ipData.ip;

                if (!clientIp) throw new Error("No IP");

                // Запрос к DaData с вашим токеном и текущим IP
                const url = "https://suggestions.dadata.ru/suggestions/api/4_1/rs/iplocate/address?ip=";
                const options = {
                    method: "GET",
                    mode: "cors",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json",
                        "Authorization": "Token " + token
                    }
                };

                const res = await fetch(url + clientIp, options);
                if (res.ok) {
                    const result = await res.json();
                    if (result && result.location && result.location.ip) {
                        el.textContent = result.location.ip;
                        return;
                    }
                }
            } catch (e) {}

            // Резервный фолбек на ipify, если DaData не ответила
            try {
                const resFallback = await fetch('https://api.ipify.org?format=json');
                const dataFallback = await resFallback.json();
                if (dataFallback && dataFallback.ip) {
                    el.textContent = dataFallback.ip;
                    return;
                }
            } catch (e) {}

            el.textContent = 'offline';
        }

        fetchGlobalIP();
        fetchRuIP();
    </script>
</body>
