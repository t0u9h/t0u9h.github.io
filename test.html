<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>shadowrocket // t0u9h</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'JetBrains Mono', monospace; 
        }
        
        body { 
            background: #0b0f19; 
            color: #f8fafc; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 16px; 
        }
        
        .terminal-window { 
            width: 100%; 
            max-width: 440px; 
            background: #0f172a; 
            border: 1px solid #334155; 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); 
        }
        
        .titlebar { 
            background: #1e293b; 
            padding: 12px 16px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 1px solid #334155; 
        }

        .dots { display: flex; gap: 8px; }
        .dot { width: 11px; height: 11px; border-radius: 50%; }
        .dot-red { background: #ef4444; }
        .dot-yellow { background: #f59e0b; }
        .dot-green { background: #10b981; }
        .window-title { font-size: 11px; color: #94a3b8; font-weight: 600; }
        
        .body { padding: 20px 16px; }
        
        .cmd-line { 
            margin-bottom: 16px; 
            font-size: 12px; 
            font-weight: 500; 
            word-break: break-word;
        }
        .user { color: #10b981; }
        .host { color: #38bdf8; }
        
        .file-list { display: flex; flex-direction: column; gap: 10px; }
        
        .file-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            background: #1e293b; 
            border: 1px solid #334155; 
            padding: 10px 12px; 
            border-radius: 10px; 
            gap: 10px;
            height: 52px;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .file-name { 
            color: #f8fafc; 
            font-weight: 600; 
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sr-logo {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .sr-logo svg {
            width: 24px;
            height: 24px;
        }

        .btn-common {
            width: 100px;
            height: 34px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
            transition: opacity 0.2s, background 0.2s;
        }

        .btn-action { 
            background: #0284c7; 
            color: #fff; 
            border: none;
        }

        .btn-action:hover { background: #0369a1; }

        .btn-appstore {
            background: #f8fafc;
            color: #0f172a;
        }

        .btn-appstore:hover { opacity: 0.9; }

        footer { 
            margin-top: 20px; 
            text-align: center; 
            font-size: 11px; 
            color: #475569; 
        }

        @media (max-width: 360px) {
            .body { padding: 12px 10px; }
            .file-row { padding: 8px; }
            .file-name { font-size: 11px; }
            .btn-common { width: 88px; height: 30px; font-size: 10px; }
            .sr-logo { width: 24px; height: 24px; }
            .sr-logo svg { width: 20px; height: 20px; }
        }
    </style>
</head>
<body>
    <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
      <linearGradient id="sr-icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8" />
        <stop offset="100%" stop-color="#a855f7" />
      </linearGradient>
    </svg>

    <div class="terminal-window">
        <div class="titlebar">
            <div class="dots">
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
            </div>
            <span class="window-title">t0u9h@shw-node:~</span>
            <div style="width: 33px;"></div>
        </div>

        <div class="body">
            <div class="cmd-line">
                <span class="user">t0u9h</span>@<span class="host">shw-node</span>:~$ ./fetch_configs.sh
            </div>

            <div class="file-list">
                <!-- App Store -->
                <div class="file-row">
                    <div class="file-info">
                        <i class="fa-brands fa-apple" style="font-size: 22px; color: #f8fafc; width: 28px; text-align: center; flex-shrink: 0;"></i>
                        <span class="file-name" style="color: #38bdf8;">App Store</span>
                    </div>
                    <a href="https://apps.apple.com/ru/app/shadowrocket/id932747118" target="_blank" class="btn-common btn-appstore">
                        <i class="fa-brands fa-apple"></i> Get App
                    </a>
                </div>

                <!-- Config 1.2 -->
                <div class="file-row">
                    <div class="file-info">
                        <div class="sr-logo">
                            <svg viewBox="0 0 100 100" fill="none" stroke="url(#sr-icon-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M 50,5 C 20,30 20,60 20,68 C 20,70 30,72 50,68 C 70,72 80,70 80,68 C 80,60 80,30 50,5 Z" />
                                <circle cx="50" cy="32" r="10" />
                                <path d="M 50,78 C 42,78 42,95 50,95 C 58,95 58,78 50,78 Z" fill="url(#sr-icon-grad)" />
                            </svg>
                        </div>
                        <span class="file-name">config_1.2.conf</span>
                    </div>
                    <a href="sub://https://t0u9h.github.io/config1.2.conf" class="btn-common btn-action">
                        <i class="fa-solid fa-bolt"></i> sub://
                    </a>
                </div>
            </div>

            <footer>© by t0u9h</footer>
        </div>
    </div>
</body>
</html>
