<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <meta name="description" content="Статус сети и конфигурация Shadowrocket">

  <title>t0u9h@shadowrocket:~</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #080b10;
      --panel: #0e131b;
      --border: #202b38;
      --text: #d6e2f0;
      --muted: #8291a5;
      --green: #64f5a2;
      --cyan: #65d9ff;
      --red: #ff7777;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
        Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 100%;
      max-width: 440px;
      max-height: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    .header {
      margin: 0 0 20px;
      color: var(--green);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .panel {
      margin-bottom: 14px;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }

    .panel-title {
      margin: 0 0 12px;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .ip-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr);
      gap: 8px;
      align-items: start;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }

    .ip-row:last-of-type {
      border-bottom: none;
    }

    .ip-label {
      min-width: 0;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .ip-value {
      display: block;
      min-width: 0;
      min-height: 42px;
      max-width: 100%;
      color: var(--green);
      text-align: right;
      line-height: 1.5;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .ip-value.loading {
      color: var(--muted);
    }

    .ip-value.error {
      color: var(--red);
    }

    .refresh-button {
      display: block;
      width: 100%;
      min-height: 40px;
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #101923;
      color: var(--cyan);
      font: inherit;
      text-align: center;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    .refresh-button:focus-visible {
      outline: 1px solid var(--cyan);
      outline-offset: 3px;
    }

    .refresh-button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .last-check {
      min-height: 15px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .links {
      display: grid;
      gap: 9px;
    }

    .link {
      display: block;
      width: 100%;
      min-height: 40px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      color: var(--cyan);
      text-decoration: none;
      overflow-wrap: anywhere;
      transition: border-color 0.2s, background 0.2s;
    }

    .link:hover,
    .link:focus-visible {
      border-color: var(--cyan);
      background: #121c27;
      outline: none;
    }

    .footer {
      margin-top: 20px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 360px) {
      .header {
        margin-bottom: 14px;
      }

      .panel {
        margin-bottom: 10px;
        padding: 11px;
      }

      .ip-row {
        gap: 6px;
        padding: 7px 0;
      }

      .ip-label,
      .ip-value {
        font-size: 10px;
      }

      .refresh-button,
      .link {
        padding: 10px;
      }

      .footer {
        margin-top: 14px;
      }
    }

    @media (max-height: 700px) {
      .header {
        margin-bottom: 10px;
      }

      .panel {
        margin-bottom: 9px;
        padding: 10px;
      }

      .panel-title {
        margin-bottom: 7px;
      }

      .ip-row {
        padding: 6px 0;
      }

      .ip-value {
        min-height: 36px;
      }

      .refresh-button {
        min-height: 36px;
        margin-top: 8px;
        padding: 8px;
      }

      .last-check {
        margin-top: 6px;
      }

      .links {
        gap: 7px;
      }

      .link {
        padding: 9px 10px;
      }

      .footer {
        margin-top: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="header">
      t0u9h@shadowrocket:~
    </header>

    <section class="panel" aria-labelledby="network-title">
      <h2 class="panel-title" id="network-title">
        Статус сети
      </h2>

      <div class="ip-row">
        <span class="ip-label">Глобальный IP:</span>
        <span
          class="ip-value loading"
          id="global-ip"
          role="status"
          aria-live="polite"
        >Загрузка...</span>
      </div>

      <div class="ip-row">
        <span class="ip-label">Прямой IP:</span>
        <span
          class="ip-value loading"
          id="direct-ip"
          role="status"
          aria-live="polite"
        >Загрузка...</span>
      </div>

      <button
        class="refresh-button"
        id="refresh-button"
        type="button"
      >↻ Обновить данные</button>

      <p class="last-check" id="last-check" aria-live="polite">
        Последняя проверка: —
      </p>
    </section>

    <nav class="links" aria-label="Основные действия">
      <a
        class="link"
        href="https://apps.apple.com/ru/app/shadowrocket/id932747118"
        target="_blank"
        rel="noopener noreferrer"
      >1. Установить shadowrocket</a>

      <a
        class="link"
        href="sub://https://t0u9h.github.io/config1.2.conf"
      >2. Добавить файл конфигурации</a>
    </nav>

    <footer class="footer">
      © by t0u9h
    </footer>
  </main>

  <script>
    "use strict";

    const REQUEST_TIMEOUT = 7000;

    const globalElement = document.getElementById("global-ip");
    const directElement = document.getElementById("direct-ip");
    const refreshButton = document.getElementById("refresh-button");
    const lastCheckElement = document.getElementById("last-check");

    let isUpdating = false;

    function isValidIP(value) {
      if (typeof value !== "string") {
        return false;
      }

      const ip = value.trim();

      const ipv4 =
        /^(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)$/;

      if (ipv4.test(ip)) {
        return true;
      }

      if (
        !ip.includes(":") ||
        !/^[0-9a-f:.]+$/i.test(ip)
      ) {
        return false;
      }

      try {
        return new URL(`http://[${ip}]/`).hostname.length > 0;
      } catch {
        return false;
      }
    }

    function formatResult(ip, country) {
      const safeCountry =
        typeof country === "string" && country.trim()
          ? country.trim()
          : "страна не определена";

      return `${ip} (${safeCountry})`;
    }

    async function fetchJson(url) {
      const controller = new AbortController();

      const timeout = setTimeout(
        () => controller.abort(),
        REQUEST_TIMEOUT
      );

      try {
        const response = await fetch(url, {
          method: "GET",
          cache: "no-store",
          signal: controller.signal,
          headers: {
            Accept: "application/json"
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        return await response.json();
      } finally {
        clearTimeout(timeout);
      }
    }

    async function getGlobalIP() {
      const data = await fetchJson("https://ipwho.is/");

      if (
        data.success === false ||
        !isValidIP(data.ip)
      ) {
        throw new Error("Некорректный ответ ipwho.is");
      }

      return formatResult(
        data.ip,
        data.country || data.country_code
      );
    }

    async function getDirectIP() {
      const data = await fetchJson("https://api.ipgeo.ru/");

      /*
       * Ожидается JSON с полями ip и country.
       * Проверяем IP, чтобы не подменять прямой адрес
       * глобальным, если сервис вернул другой формат.
       */
      if (
        !data ||
        typeof data !== "object" ||
        !isValidIP(data.ip)
      ) {
        throw new Error("Некорректный ответ api.ipgeo.ru");
      }

      return formatResult(
        data.ip,
        data.country || data.country_code
      );
    }

    async function loadService(element, request) {
      element.classList.remove("error");
      element.classList.add("loading");
      element.textContent = "Проверка...";

      try {
        const result = await request();
        element.textContent = result;
      } catch (error) {
        element.textContent =
          error.name === "AbortError"
            ? "Время ожидания истекло"
            : "Недоступно";

        element.classList.add("error");
      } finally {
        element.classList.remove("loading");
      }
    }

    async function updateData() {
      if (isUpdating) {
        return;
      }

      isUpdating = true;
      refreshButton.disabled = true;
      refreshButton.textContent = "Проверка...";

      try {
        await Promise.all([
          loadService(globalElement, getGlobalIP),
          loadService(directElement, getDirectIP)
        ]);

        lastCheckElement.textContent =
          "Последняя проверка: " +
          new Date().toLocaleTimeString("ru-RU");
      } finally {
        isUpdating = false;
        refreshButton.disabled = false;
        refreshButton.textContent = "↻ Обновить данные";
      }
    }

    refreshButton.addEventListener("click", updateData);

    updateData();
  </script>
</body>
</html>
