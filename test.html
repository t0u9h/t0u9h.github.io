<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shadowrocket // t0u9h</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }
        
        body { 
            background: #0b0f19; 
            color: #f8fafc; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 16px; 
        }
        
        .terminal-window { 
            width: 100%; 
            max-width: 440px; 
            background: #0f172a; 
            border: 1px solid #334155; 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); 
        }
        
        .titlebar { 
            background: #1e293b; 
            padding: 12px 16px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 1px solid #334155; 
        }

        .dots { display: flex; gap: 8px; }
        .dot { width: 11px; height: 11px; border-radius: 50%; }
        .dot-red { background: #ef4444; }
        .dot-yellow { background: #f59e0b; }
        .dot-green { background: #10b981; }
        .window-title { font-size: 11px; color: #94a3b8; font-weight: 600; }
        
        .body { padding: 20px 16px; }
        .cmd-line { margin-bottom: 16px; font-size: 12px; font-weight: 500; }
        .user { color: #10b981; }
        .host { color: #38bdf8; }
        
        .file-list { display: flex; flex-direction: column; gap: 10px; }
        
        .file-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            background: #1e293b; 
            border: 1px solid #334155; 
            padding: 10px 12px; 
            border-radius: 10px; 
            gap: 10px;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .file-name { 
            color: #f8fafc; 
            font-weight: 600; 
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Точный SVG Логотип Shadowrocket (Синяя иконка с ракетой) */
        .sr-logo {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #1c72ecee, #0b50b8);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(11, 80, 184, 0.4);
        }

        .sr-logo svg {
            width: 16px;
            height: 16px;
            fill: #ffffff;
        }

        /* Кнопки действий */
        .actions { display: flex; gap: 6px; flex-shrink: 0; }

        .btn-action { 
            background: #0284c7; 
            color: #fff; 
            padding: 6px 10px; 
            border-radius: 6px; 
            text-decoration: none; 
            font-size: 11px; 
            font-weight: 600; 
            display: inline-flex; 
            align-items: center; 
            gap: 4px; 
            transition: background 0.2s; 
            border: none;
            cursor: pointer;
        }

        .btn-action:hover { background: #0369a1; }

        .btn-icon-only { 
            background: transparent; 
            border: 1px solid #475569; 
            color: #94a3b8; 
            padding: 6px 9px;
        }

        .btn-icon-only:hover { 
            border-color: #38bdf8; 
            color: #38bdf8; 
            background: rgba(56, 189, 248, 0.05);
        }

        .btn-appstore {
            background: #f8fafc;
            color: #0f172a;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .btn-appstore:hover { opacity: 0.9; }

        footer { margin-top: 18px; text-align: center; font-size: 11px; color: #475569; }
    </style>
</head>
