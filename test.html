<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d0b">
  <title>t0u9h@shadowrocket:~</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      background: #080d0b;
      color: #b8ffd2;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      border: 1px solid #174b35;
      border-radius: 12px;
      padding: 24px;
      background: #0b120e;
      box-shadow: 0 0 25px rgba(0, 255, 128, 0.06);
    }

    .title {
      color: #43ff9a;
      font-size: 20px;
      margin: 0 0 24px;
      overflow-wrap: anywhere;
    }

    .section-title {
      color: #43ff9a;
      font-size: 15px;
      margin: 0 0 16px;
    }

    .status-box {
      border: 1px solid #174b35;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .ip-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin: 12px 0;
      font-size: 13px;
    }

    .ip-label {
      color: #86b99b;
      flex-shrink: 0;
    }

    .ip-value {
      color: #65caff;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .refresh-button,
    .action-button {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid #23774d;
      border-radius: 7px;
      background: #10271a;
      color: #65ffad;
      font-family: monospace;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .refresh-button:hover,
    .action-button:hover {
      background: #173b26;
      border-color: #43ff9a;
    }

    .refresh-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .last-check {
      color: #668774;
      font-size: 11px;
      text-align: center;
      margin: 12px 0 0;
    }

    .actions {
      display: grid;
      gap: 12px;
    }

    footer {
      color: #426d53;
      text-align: center;
      font-size: 11px;
      margin-top: 24px;
    }

    @media (max-width: 360px) {
      .container {
        padding: 16px;
      }

      .title {
        font-size: 17px;
      }

      .ip-row {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1 class="title">t0u9h@shadowrocket:~</h1>

    <section class="status-box">
      <h2 class="section-title">Статус сети</h2>

      <div class="ip-row">
        <span class="ip-label">Глобальный IP:</span>
        <span class="ip-value" id="global-ip">Проверка...</span>
      </div>

      <div class="ip-row">
        <span class="ip-label">Прямой IP:</span>
        <span class="ip-value" id="direct-ip">Проверка...</span>
      </div>

      <button class="refresh-button" id="refresh-button" type="button">
        ↻ Обновить данные
      </button>

      <p class="last-check" id="last-check">
        Последняя проверка: ещё не выполнялась
      </p>
    </section>

    <div class="actions">
      <a
        class="action-button"
        href="https://apps.apple.com/ru/app/shadowrocket/id932747118"
      >
        1. Установить Shadowrocket
      </a>

      <a
        class="action-button"
        href="sub://https://t0u9h.github.io/config1.2.conf"
      >
        2. Добавить файл конфигурации
      </a>
    </div>

    <footer>© by t0u9h</footer>
  </main>

  <script>
    const globalIpElement = document.getElementById("global-ip");
    const directIpElement = document.getElementById("direct-ip");
    const refreshButton = document.getElementById("refresh-button");
    const lastCheckElement = document.getElementById("last-check");

    async function fetchWithTimeout(url, timeout = 7000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);

      try {
        return await fetch(url, {
          cache: "no-store",
          signal: controller.signal
        });
      } finally {
        clearTimeout(timer);
      }
    }

    async function getGlobalIp() {
      const response = await fetchWithTimeout("https://ipwho.is/");

      if (!response.ok) {
        throw new Error("Не удалось получить данные");
      }

      const data = await response.json();

      if (!data.success || !data.ip) {
        throw new Error("IP не найден");
      }

      return data.ip;
    }

    async function getDirectIp() {
      const response = await fetchWithTimeout("https://api.ipgeo.ru/");

      if (!response.ok) {
        throw new Error("Не удалось получить данные");
      }

      const data = await response.json();

      if (typeof data === "string") {
        return data.trim();
      }

      const ip = data.ip || data.query || data.address;

      if (!ip) {
        throw new Error("IP не найден");
      }

      return ip;
    }

    async function updateData() {
      refreshButton.disabled = true;
      refreshButton.textContent = "⟳ Проверка...";
      globalIpElement.textContent = "Проверка...";
      directIpElement.textContent = "Проверка...";

      try {
        const results = await Promise.allSettled([
          getGlobalIp(),
          getDirectIp()
        ]);

        globalIpElement.textContent =
          results[0].status === "fulfilled"
            ? results[0].value
            : "Недоступен";

        directIpElement.textContent =
          results[1].status === "fulfilled"
            ? results[1].value
            : "Недоступен";

        lastCheckElement.textContent =
          "Последняя проверка: " +
          new Date().toLocaleTimeString("ru-RU");
      } finally {
        refreshButton.disabled = false;
        refreshButton.textContent = "↻ Обновить данные";
      }
    }

    refreshButton.addEventListener("click", updateData);

    updateData();
  </script>
</body>
</html>
