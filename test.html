<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c0e14">
  <title>t0u9h@shadowrocket:~</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: #0c0e14;
      color: #d0e1f9;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .container {
      width: 100%;
      max-width: 440px;
      max-height: calc(100% - 24px);
      overflow-y: auto;
      scrollbar-width: none;
      border: 1px solid #232a3b;
      border-radius: 16px;
      padding: 18px;
      background: #131620;
      box-shadow: 0 10px 30px rgba(125, 82, 244, 0.08);
    }

    .container::-webkit-scrollbar {
      display: none;
    }

    .title {
      color: #ffffff;
      font-size: 18px;
      line-height: 1.3;
      margin: 0 0 16px;
      overflow-wrap: anywhere;
    }

    .status-box {
      border: 1px solid #1a2533;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      background: #101921;
    }

    .section-title {
      color: #64728d;
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin: 0 0 12px;
      font-weight: 700;
    }

    .ip-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin: 10px 0;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(35, 42, 59, 0.5);
    }

    .ip-row:last-of-type {
      border-bottom: none;
      padding-bottom: 0;
    }

    .ip-label {
      color: #64728d;
      font-size: 11px;
      letter-spacing: 0.3px;
    }

    .ip-value {
      min-width: 0;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.3px;
      text-align: left;
      word-break: break-all;
      overflow-wrap: anywhere;
    }

    .ip-value-global {
      color: #65d9ff;
    }

    .ip-value-direct {
      color: #c084fc;
    }

    .country {
      display: inline-block;
      color: #a0aec0;
      font-size: 11px;
      font-weight: normal;
      margin-left: 4px;
      letter-spacing: normal;
    }

    button,
    .action-button {
      display: block;
      width: 100%;
      min-height: 40px;
      padding: 10px;
      border: 1px solid #2a224a;
      border-radius: 8px;
      background: #17162b;
      color: #a855f7;
      font-family: monospace;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover,
    .action-button:hover {
      border-color: #7d52f4;
      background: #201a3d;
      color: #c084fc;
    }

    button:focus-visible,
    .action-button:focus-visible {
      outline: 1px solid #a855f7;
      outline-offset: 3px;
    }

    .refresh-button {
      margin-top: 12px;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .last-check {
      min-height: 14px;
      color: #4a5568;
      font-size: 10px;
      line-height: 1.4;
      text-align: center;
      margin: 8px 0 0;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    footer {
      color: #4a5568;
      text-align: center;
      font-size: 11px;
      margin-top: 14px;
    }

    @media (min-width: 380px) {
      .ip-row {
        display: grid;
        grid-template-columns: 105px minmax(0, 1fr);
        align-items: start;
        gap: 8px;
        border-bottom: none;
        padding-bottom: 0;
      }

      .ip-value {
        text-align: right;
      }

      .country {
        display: block;
        margin-left: 0;
        margin-top: 2px;
      }
    }

    @media (max-height: 600px) {
      .container {
        padding: 10px;
      }

      .title {
        margin-bottom: 10px;
      }

      .status-box {
        padding: 10px;
        margin-bottom: 8px;
      }

      .ip-row {
        margin: 6px 0;
      }

      footer {
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1 class="title">t0u9h@shadowrocket:~</h1>

    <section class="status-box">
      <h2 class="section-title">Статус сети</h2>

      <div class="ip-row">
        <span class="ip-label">Глобальный IP:</span>
        <span class="ip-value ip-value-global">
          <span id="global-ip">Загрузка...</span>
          <span class="country" id="global-country"></span>
        </span>
      </div>

      <div class="ip-row">
        <span class="ip-label">Прямой IP:</span>
        <span class="ip-value ip-value-direct">
          <span id="direct-ip">Загрузка...</span>
          <span class="country" id="direct-country"></span>
        </span>
      </div>

      <button
        class="refresh-button"
        id="refresh-button"
        type="button"
      >
        ↻ Обновить данные
      </button>

      <p class="last-check" id="last-check">
        Последняя проверка: —
      </p>
    </section>

    <div class="actions">
      <a
        class="action-button"
        href="https://apps.apple.com/ru/app/shadowrocket/id932747118"
      >
        1. Установить Shadowrocket
      </a>

      <a
        class="action-button"
        href="shadowrocket://config/add/https://raw.githubusercontent.com/t0u9h/sr-rules/main/antcenz_norm_ru.conf"
      >
        2. Добавить файл конфигурации
      </a>
    </div>

    <footer>© by t0u9h</footer>
  </main>

  <script>
    const globalIpElement = document.getElementById("global-ip");
    const globalCountryElement = document.getElementById("global-country");

    const directIpElement = document.getElementById("direct-ip");
    const directCountryElement = document.getElementById("direct-country");

    const refreshButton = document.getElementById("refresh-button");
    const lastCheckElement = document.getElementById("last-check");

    async function fetchJson(url, timeout = 7000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);

      try {
        const response = await fetch(url, {
          cache: "no-store",
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        return await response.json();
      } finally {
        clearTimeout(timer);
      }
    }

    // Глобальный IP через ipwho.is
    async function getGlobalIp() {
      const data = await fetchJson("https://ipwho.is/");

      if (!data.success || !data.ip) {
        throw new Error("Глобальный IP недоступен");
      }

      return {
        ip: data.ip,
        country: data.country || "Страна не определена"
      };
    }

    // Прямой IP через российский сервис ipapi.ipgeo.ru
    async function getDirectIp() {
      const data = await fetchJson("https://ipapi.ipgeo.ru/json/");

      if (!data || !data.ip) {
        throw new Error("Прямой IP не найден");
      }

      return {
        ip: data.ip,
        country: data.country || data.country_name || "Россия"
      };
    }

    async function updateData() {
      refreshButton.disabled = true;
      refreshButton.textContent = "Проверка...";

      globalIpElement.textContent = "Проверка...";
      globalCountryElement.textContent = "";

      directIpElement.textContent = "Проверка...";
      directCountryElement.textContent = "";

      try {
        const results = await Promise.allSettled([
          getGlobalIp(),
          getDirectIp()
        ]);

        if (results[0].status === "fulfilled") {
          const result = results[0].value;
          globalIpElement.textContent = result.ip;
          globalCountryElement.textContent = result.country;
        } else {
          globalIpElement.textContent = "Недоступен";
          globalCountryElement.textContent = "Не удалось проверить";
        }

        if (results[1].status === "fulfilled") {
          const result = results[1].value;
          directIpElement.textContent = result.ip;
          directCountryElement.textContent = result.country;
        } else {
          directIpElement.textContent = "Недоступен";
          directCountryElement.textContent = "Не удалось проверить";
        }

        lastCheckElement.textContent =
          "Последняя проверка: " +
          new Date().toLocaleTimeString("ru-RU");
      } catch (error) {
        lastCheckElement.textContent = "Ошибка обновления данных";
      } finally {
        refreshButton.disabled = false;
        refreshButton.textContent = "↻ Обновить данные";
      }
    }

    refreshButton.addEventListener("click", updateData);

    updateData();
  </script>
</body>
</html>
