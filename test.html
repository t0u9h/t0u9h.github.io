<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d0b">
  <title>t0u9h@shadowrocket:~</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #080d0b;
      color: #b8ffd2;
      font-family: monospace;
    }

    .container {
      width: 100%;
      max-width: 440px;
      max-height: calc(100% - 32px);
      overflow-y: auto;
      scrollbar-width: none;
      border: 1px solid #174b35;
      border-radius: 12px;
      padding: 22px;
      background: #0b120e;
      box-shadow: 0 0 25px rgba(0, 255, 128, 0.06);
    }

    .container::-webkit-scrollbar {
      display: none;
    }

    .title {
      color: #43ff9a;
      font-size: 20px;
      line-height: 1.4;
      margin: 0 0 22px;
      overflow-wrap: anywhere;
    }

    .status-box {
      border: 1px solid #174b35;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 18px;
    }

    .section-title {
      color: #43ff9a;
      font-size: 14px;
      margin: 0 0 16px;
    }

    .ip-row {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr);
      align-items: start;
      gap: 10px;
      margin: 14px 0;
      font-size: 12px;
      line-height: 1.5;
    }

    .ip-label {
      color: #86b99b;
    }

    .ip-value {
      min-width: 0;
      min-height: 34px;
      color: #65caff;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .country {
      display: block;
      min-height: 16px;
      color: #86b99b;
      font-size: 11px;
      margin-top: 3px;
    }

    button,
    .action-button {
      display: block;
      width: 100%;
      min-height: 42px;
      padding: 12px;
      border: 1px solid #23774d;
      border-radius: 7px;
      background: #10271a;
      color: #65ffad;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.3;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    .action-button:focus-visible {
      outline: 1px solid #43ff9a;
      outline-offset: 3px;
    }

    .refresh-button {
      margin-top: 16px;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .last-check {
      min-height: 14px;
      color: #668774;
      font-size: 10px;
      line-height: 1.5;
      text-align: center;
      margin: 10px 0 0;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    footer {
      color: #426d53;
      text-align: center;
      font-size: 11px;
      margin-top: 20px;
    }

    @media (max-width: 360px) {
      .container {
        padding: 15px;
      }

      .title {
        font-size: 18px;
      }

      .ip-row {
        grid-template-columns: 105px minmax(0, 1fr);
        gap: 6px;
      }

      .ip-label,
      .ip-value {
        font-size: 11px;
      }
    }

    @media (max-height: 600px) {
      .container {
        padding: 12px;
      }

      .title {
        margin-bottom: 12px;
      }

      .status-box {
        padding: 10px;
        margin-bottom: 10px;
      }

      .ip-row {
        margin: 8px 0;
      }

      footer {
        margin-top: 10px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1 class="title">t0u9h@shadowrocket:~</h1>

    <section class="status-box">
      <h2 class="section-title">Статус сети</h2>

      <div class="ip-row">
        <span class="ip-label">Глобальный IP:</span>
        <span class="ip-value">
          <span id="global-ip">Загрузка...</span>
          <span class="country" id="global-country"></span>
        </span>
      </div>

      <div class="ip-row">
        <span class="ip-label">Прямой IP:</span>
        <span class="ip-value">
          <span id="direct-ip">Загрузка...</span>
          <span class="country" id="direct-country"></span>
        </span>
      </div>

      <button
        class="refresh-button"
        id="refresh-button"
        type="button"
      >
        ↻ Обновить данные
      </button>

      <p class="last-check" id="last-check">
        Последняя проверка: —
      </p>
    </section>

    <div class="actions">
      <a
        class="action-button"
        href="https://apps.apple.com/ru/app/shadowrocket/id932747118"
      >
        1. Установить Shadowrocket
      </a>

      <a
        class="action-button"
        href="sub://https://t0u9h.github.io/config1.2.conf"
      >
        2. Добавить файл конфигурации
      </a>
    </div>

    <footer>© by t0u9h</footer>
  </main>

  <script>
    const globalIpElement = document.getElementById("global-ip");
    const globalCountryElement = document.getElementById("global-country");

    const directIpElement = document.getElementById("direct-ip");
    const directCountryElement = document.getElementById("direct-country");

    const refreshButton = document.getElementById("refresh-button");
    const lastCheckElement = document.getElementById("last-check");

    async function fetchJson(url, timeout = 7000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);

      try {
        const response = await fetch(url, {
          cache: "no-store",
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        return await response.json();
      } finally {
        clearTimeout(timer);
      }
    }

    // Глобальный IP и страна через ipwho.is
    async function getGlobalIp() {
      const data = await fetchJson("https://ipwho.is/");

      if (!data.success || !data.ip) {
        throw new Error("Глобальный IP недоступен");
      }

      return {
        ip: data.ip,
        country: data.country || "Страна не определена"
      };
    }

    // Прямой IP через отдельный сервис
    async function getDirectIp() {
      const data = await fetchJson("https://api.ipgeo.ru/");

      let ip;
      let country = "Страна не определена";

      if (typeof data === "string") {
        ip = data.trim();
      } else {
        ip = data.ip || data.query || data.address;

        country =
          data.country ||
          data.country_name ||
          data.countryName ||
          country;
      }

      if (!ip) {
        throw new Error("Прямой IP не найден");
      }

      return {
        ip: ip,
        country: country
      };
    }

    async function updateData() {
      refreshButton.disabled = true;
      refreshButton.textContent = "Проверка...";

      globalIpElement.textContent = "Проверка...";
      globalCountryElement.textContent = "";

      directIpElement.textContent = "Проверка...";
      directCountryElement.textContent = "";

      try {
        const results = await Promise.allSettled([
          getGlobalIp(),
          getDirectIp()
        ]);

        if (results[0].status === "fulfilled") {
          const result = results[0].value;

          globalIpElement.textContent = result.ip;
          globalCountryElement.textContent = "🌍 " + result.country;
        } else {
          globalIpElement.textContent = "Недоступен";
          globalCountryElement.textContent = "Не удалось проверить";
        }

        if (results[1].status === "fulfilled") {
          const result = results[1].value;

          directIpElement.textContent = result.ip;
          directCountryElement.textContent = "🌍 " + result.country;
        } else {
          directIpElement.textContent = "Недоступен";
          directCountryElement.textContent = "Не удалось проверить";
        }

        lastCheckElement.textContent =
          "Последняя проверка: " +
          new Date().toLocaleTimeString("ru-RU");
      } catch (error) {
        lastCheckElement.textContent = "Ошибка обновления данных";
      } finally {
        refreshButton.disabled = false;
        refreshButton.textContent = "↻ Обновить данные";
      }
    }

    refreshButton.addEventListener("click", updateData);

    updateData();
  </script>
</body>
</html>
